<html lang="hi">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🚛 Truck Wala 90s Music</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  background:
    linear-gradient(#75cfff 0%,#b9edff 45%,#80a96d 45%,#557346 100%);
  color:#fff;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 15% 18%,rgba(255,255,255,.9) 0 35px,transparent 36px),
    radial-gradient(circle at 22% 18%,rgba(255,255,255,.9) 0 48px,transparent 49px),
    radial-gradient(circle at 28% 19%,rgba(255,255,255,.8) 0 30px,transparent 31px);
  opacity:.8;
  pointer-events:none;
}

.app{
  width:min(560px,94vw);
  margin:25px auto;
  position:relative;
  z-index:2;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(20,20,20,.92);
  padding:13px 16px;
  border-radius:18px 18px 8px 8px;
  border:2px solid #ffb000;
  box-shadow:0 8px 25px rgba(0,0,0,.35);
}

.logo{
  font-weight:900;
  font-size:21px;
  color:#ffb000;
  text-shadow:2px 2px #000;
}

.logo small{
  display:block;
  color:#fff;
  font-size:10px;
  letter-spacing:2px;
}

.clock{
  font-size:13px;
  color:#ddd;
}

.player{
  margin-top:10px;
  background:linear-gradient(145deg,#252525,#090909);
  border:2px solid #ffb000;
  border-radius:22px;
  padding:18px;
  box-shadow:
    0 15px 35px rgba(0,0,0,.5),
    inset 0 1px rgba(255,255,255,.12);
}

.now{
  display:flex;
  gap:15px;
  align-items:center;
}

.coverBox{
  width:105px;
  height:105px;
  flex:none;
  border-radius:16px;
  overflow:hidden;
  background:#333;
  border:3px solid #555;
  box-shadow:0 5px 15px #000;
}

.cover{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info{
  min-width:0;
  flex:1;
}

.label{
  font-size:10px;
  color:#ffb000;
  font-weight:bold;
  letter-spacing:2px;
  margin-bottom:5px;
}

.title{
  font-size:19px;
  font-weight:800;
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.artist{
  color:#aaa;
  font-size:13px;
  margin-top:7px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.progress{
  margin-top:20px;
}

.seek{
  height:9px;
  border-radius:20px;
  background:#444;
  position:relative;
  cursor:pointer;
  overflow:hidden;
}

.seekFill{
  position:absolute;
  inset:0;
  width:100%;
  background:linear-gradient(90deg,#ff7100,#ffd000);
  transform-origin:left;
  transform:scaleX(0);
}

.seekKnob{
  position:absolute;
  width:15px;
  height:15px;
  top:50%;
  left:0;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 8px #ffb000;
}

.times{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:#999;
  margin-top:5px;
}

.controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-top:17px;
}

.btn{
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:#333;
  color:#fff;
  cursor:pointer;
  font-size:18px;
  transition:.15s;
  box-shadow:0 4px 10px #000;
}

.btn:hover{
  transform:scale(1.08);
  background:#454545;
}

.btn:active{
  transform:scale(.94);
}

.play{
  width:62px;
  height:62px;
  font-size:25px;
  background:linear-gradient(145deg,#ffb900,#e76d00);
  color:#111;
  border:3px solid #ffe07b;
}

.play:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.active{
  color:#ffb000;
}

.bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:15px;
}

.shuffle,.playlistBtn,.horn{
  border:1px solid #555;
  background:#181818;
  color:#ddd;
  border-radius:12px;
  padding:9px 12px;
  cursor:pointer;
  font-size:12px;
}

.shuffle.active,
.playlistBtn.active{
  color:#ffb000;
  border-color:#ffb000;
}

.horn{
  font-size:18px;
  padding:7px 12px;
}

.playlist{
  display:none;
  margin-top:10px;
  background:rgba(10,10,10,.96);
  border:2px solid #444;
  border-radius:18px;
  overflow:hidden;
  max-height:430px;
}

.playlist.open{
  display:block;
}

.playlistHead{
  position:sticky;
  top:0;
  z-index:3;
  padding:13px 15px;
  background:#151515;
  border-bottom:1px solid #444;
  display:flex;
  justify-content:space-between;
}

.playlistHead strong{
  color:#ffb000;
}

.songList{
  list-style:none;
}

.songList li button{
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:#fff;
  padding:11px 14px;
  border-bottom:1px solid #292929;
  cursor:pointer;
}

.songList li button:hover{
  background:#252525;
}

.songList li.current button{
  background:linear-gradient(90deg,rgba(255,170,0,.25),transparent);
  border-left:4px solid #ffb000;
}

.songTitle{
  display:block;
  font-weight:bold;
  font-size:13px;
}

.songArtist{
  display:block;
  color:#888;
  font-size:11px;
  margin-top:3px;
}

.truckRoad{
  margin-top:15px;
  height:130px;
  border-radius:18px;
  overflow:hidden;
  position:relative;
  background:
    linear-gradient(#85d8ff 0 42%,#638d49 42% 58%,#303030 58% 100%);
  border:2px solid #222;
}

.road{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:55px;
  background:#252525;
}

.road:before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:25px;
  height:5px;
  background:repeating-linear-gradient(
    90deg,
    #fff 0 45px,
    transparent 45px 90px
  );
  animation:road 1s linear infinite;
}

.truck{
  position:absolute;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  font-size:52px;
  filter:drop-shadow(3px 4px 2px #000);
  animation:truckMove .7s ease-in-out infinite alternate;
}

@keyframes road{
  from{transform:translateX(0)}
  to{transform:translateX(-90px)}
}

@keyframes truckMove{
  from{transform:translateX(-50%) translateY(0)}
  to{transform:translateX(-50%) translateY(-2px)}
}

.footer{
  text-align:center;
  color:#333;
  font-size:11px;
  margin:12px;
  font-weight:bold;
}

#yt-player{
  position:fixed;
  width:1px;
  height:1px;
  left:-100px;
  top:-100px;
  opacity:.01;
  pointer-events:none;
}

@media(max-width:480px){
  .app{margin:10px auto}
  .player{padding:14px}
  .coverBox{width:88px;height:88px}
  .title{font-size:16px}
  .controls{gap:7px}
  .btn{width:40px;height:40px}
  .play{width:56px;height:56px}
}
</style>

  </div>

  <div class="footer">
    🚛 SAFE DRIVE • HORN PLEASE • ENJOY THE JOURNEY 🎵
  </div>

</div>

/* ============================================================
   PLAYER ENGINE
   ============================================================ */

const $ = id => document.getElementById(id);

const el = {
  player:$("player"),
  cover:$("cover"),
  title:$("title"),
  artist:$("artist"),
  seek:$("seek"),
  seekFill:$("seekFill"),
  seekKnob:$("seekKnob"),
  tCur:$("tCur"),
  tDur:$("tDur"),
  play:$("play"),
  prev:$("prev"),
  next:$("next"),
  shuffle:$("shuffle"),
  listBtn:$("listBtn"),
  list:$("list"),
  listItems:$("listItems"),
  songCount:$("songCount"),
  clock:$("clock"),
  horn:$("horn")
};

let yt=null;

let state={
  tracks:SONGS,
  order:[],
  pos:0,
  shuffle:true,
  ready:false,
  playing:false,
  started:false,
  scrubbing:false
};


/* ---------- Shuffle ---------- */

function shuffleArray(arr){

  for(let i=arr.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [arr[i],arr[j]]=[arr[j],arr[i]];

  }

  return arr;
}


function buildOrder(){

  const order=state.tracks.map((_,i)=>i);

  return state.shuffle
    ? shuffleArray(order)
    : order;
}


/* ---------- Current Song ---------- */

function currentTrack(){

  return state.tracks[state.order[state.pos]];

}


/* ---------- Format ---------- */

function fmt(sec){

  if(!Number.isFinite(sec)||sec<0)sec=0;

  return Math.floor(sec/60)+":"+
    String(Math.floor(sec%60)).padStart(2,"0");

}


/* ---------- Render Song ---------- */

function renderTrack(){

  const t=currentTrack();

  if(!t)return;

  el.title.textContent=t.title;
  el.artist.textContent=t.artist || "";
  el.cover.src=t.cover || "";
  el.cover.alt=t.title;

  document.title=t.title+" — Truck Wala";

  [...el.listItems.children].forEach((li,i)=>{

    li.classList.toggle("current",i===state.pos);

  });

}


/* ---------- Render Playlist ---------- */

function renderList(){

  el.listItems.innerHTML="";

  state.order.forEach((trackIndex,i)=>{

    const t=state.tracks[trackIndex];

    const li=document.createElement("li");

    const button=document.createElement("button");

    const title=document.createElement("span");

    title.className="songTitle";

    title.textContent=(i+1)+". "+t.title;

    const artist=document.createElement("span");

    artist.className="songArtist";

    artist.textContent=t.artist || "";

    button.append(title,artist);

    button.onclick=()=>go(i);

    li.append(button);

    el.listItems.append(li);

  });

  el.songCount.textContent=state.tracks.length+" Songs";

}


/* ---------- Go Song ---------- */

function go(newPos){

  const n=state.order.length;

  if(!n)return;

  state.pos=((newPos%n)+n)%n;

  renderTrack();

  resetProgress();

  if(yt){

    state.started=true;

    yt.loadVideoById(currentTrack().id);

  }

}


/* ---------- Play Pause ---------- */

function toggle(){

  if(!yt||!state.ready)return;

  if(state.playing){

    yt.pauseVideo();

  }else{

    state.started=true;

    yt.playVideo();

  }

}


/* ---------- Playing UI ---------- */

function renderPlaying(on){

  state.playing=on;

  el.player.classList.toggle("playing",on);

  el.play.textContent=on?"⏸":"▶";

}


/* ---------- Progress ---------- */

let poll={
  time:0,
  duration:0,
  at:0
};

function sample(){

  if(!yt)return;

  try{

    poll.time=yt.getCurrentTime()||0;
    poll.duration=yt.getDuration()||0;
    poll.at=performance.now();

  }catch(e){}

}


function paint(){

  requestAnimationFrame(paint);

  if(!yt||state.scrubbing||!poll.duration)return;

  const drift=state.playing
    ?(performance.now()-poll.at)/1000
    :0;

  const cur=Math.min(
    poll.duration,
    poll.time+drift
  );

  const frac=Math.max(
    0,
    Math.min(1,cur/poll.duration)
  );

  el.seekFill.style.transform=
    "scaleX("+frac+")";

  el.seekKnob.style.left=
    (frac*100)+"%";

  el.tCur.textContent=fmt(cur);

  el.tDur.textContent=fmt(poll.duration);

}


/* ---------- Reset Progress ---------- */

function resetProgress(){

  poll.time=0;
  poll.duration=0;
  poll.at=performance.now();

  el.seekFill.style.transform="scaleX(0)";
  el.seekKnob.style.left="0%";

  el.tCur.textContent="0:00";
  el.tDur.textContent="0:00";

}


/* ---------- Seeking ---------- */

function fractionFromEvent(e){

  const r=el.seek.getBoundingClientRect();

  return Math.max(
    0,
    Math.min(
      1,
      (e.clientX-r.left)/r.width
    )
  );

}


function previewSeek(frac){

  el.seekFill.style.transform=
    "scaleX("+frac+")";

  el.seekKnob.style.left=
    (frac*100)+"%";

  if(yt){

    const dur=yt.getDuration()||0;

    el.tCur.textContent=fmt(dur*frac);

  }

}


el.seek.addEventListener("pointerdown",e=>{

  if(!yt)return;

  state.scrubbing=true;

  el.seek.setPointerCapture(e.pointerId);

  previewSeek(
    fractionFromEvent(e)
  );

});


el.seek.addEventListener("pointermove",e=>{

  if(state.scrubbing){

    previewSeek(
      fractionFromEvent(e)
    );

  }

});


el.seek.addEventListener("pointerup",e=>{

  if(!state.scrubbing)return;

  state.scrubbing=false;

  const frac=fractionFromEvent(e);

  const dur=yt?.getDuration?.()||0;

  if(dur){

    yt.seekTo(dur*frac,true);

  }

  sample();

});


/* ---------- Buttons ---------- */

el.play.onclick=toggle;

el.prev.onclick=()=>{

  if(yt&&(yt.getCurrentTime()||0)>3){

    yt.seekTo(0,true);

  }else{

    go(state.pos-1);

  }

};

el.next.onclick=()=>go(state.pos+1);


el.shuffle.onclick=()=>{

  const keep=currentTrack();

  state.shuffle=!state.shuffle;

  el.shuffle.classList.toggle(
    "active",
    state.shuffle
  );

  state.order=buildOrder();

  const oldIndex=
    state.tracks.indexOf(keep);

  state.pos=
    Math.max(
      0,
      state.order.indexOf(oldIndex)
    );

  renderList();
  renderTrack();

};


el.listBtn.onclick=()=>{

  const open=
    !el.list.classList.contains("open");

  el.list.classList.toggle(
    "open",
    open
  );

  el.listBtn.classList.toggle(
    "active",
    open
  );

};


/* ---------- Keyboard ---------- */

document.addEventListener("keydown",e=>{

  if(
    e.target.matches(
      "input,textarea,[contenteditable]"
    )
  )return;

  if(e.code==="Space"){

    e.preventDefault();

    toggle();

  }

  if(e.key==="ArrowRight"&&e.target!==el.seek){

    go(state.pos+1);

  }

  if(e.key==="ArrowLeft"&&e.target!==el.seek){

    go(state.pos-1);

  }

});


/* ============================================================
   TRUCK HORN
   ============================================================ */

let audioCtx=null;

function horn(){

  try{

    audioCtx=
      audioCtx ||
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

    if(audioCtx.state==="suspended")
      audioCtx.resume();

    const now=audioCtx.currentTime;

    const osc1=audioCtx.createOscillator();
    const osc2=audioCtx.createOscillator();

    const gain=audioCtx.createGain();

    osc1.type="sawtooth";
    osc2.type="square";

    osc1.frequency.value=310;
    osc2.frequency.value=295;

    gain.gain.setValueAtTime(.0001,now);
    gain.gain.exponentialRampToValueAtTime(
      .35,
      now+.03
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      now+.65
    );

    osc1.connect(gain);
    osc2.connect(gain);

    gain.connect(audioCtx.destination);

    osc1.start(now);
    osc2.start(now);

    osc1.stop(now+.7);
    osc2.stop(now+.7);

    el.horn.classList.add("active");

    setTimeout(
      ()=>el.horn.classList.remove("active"),
      700
    );

  }catch(e){}

}

el.horn.onclick=horn;


/* ============================================================
   CLOCK
   ============================================================ */

function clock(){

  el.clock.textContent=
    new Date().toLocaleTimeString(
      "en-IN",
      {
        hour:"numeric",
        minute:"2-digit"
      }
    );

}

clock();

setInterval(clock,15000);


/* ============================================================
   YOUTUBE AUDIO ENGINE
   ============================================================ */

window.onYouTubeIframeAPIReady=function(){

  yt=new YT.Player(
    "yt-player",
    {

      height:"1",
      width:"1",

      videoId:currentTrack().id,

      playerVars:{
        playsinline:1,
        controls:0,
        disablekb:1,
        modestbranding:1,
        rel:0
      },

      events:{

        onReady:()=>{

          state.ready=true;

          el.play.disabled=false;

          renderTrack();

          sample();

        },

        onStateChange:e=>{

          const S=YT.PlayerState;

          if(e.data===S.PLAYING){

            renderPlaying(true);

            sample();

          }

          else if(e.data===S.PAUSED){

            renderPlaying(false);

            sample();

          }

          else if(e.data===S.ENDED){

            go(state.pos+1);

          }

        },

        onError:()=>{

          if(state.started){

            setTimeout(
              ()=>go(state.pos+1),
              500
            );

          }

        }

      }

    }
  );

  setInterval(sample,250);

  requestAnimationFrame(paint);

};


/* ============================================================
   INITIALIZE
   ============================================================ */

function init(){

  state.order=buildOrder();

  renderList();

  renderTrack();

  el.title.textContent=
    currentTrack()?.title ||
    "Playlist Ready";

}

init();


/* Load YouTube API */

const script=document.createElement("script");

script.src=
  "https://www.youtube.com/iframe_api";

document.head.appendChild(script);

</script>
