<!doctype html>
<html lang="en">

<head>
  <meta name="theme-color" content="#111827"/>
  <meta charset='UTF-8'/>
  <meta content='width=device-width, initial-scale=1.0' name='viewport'/>

  <title>Social Highway India - Truck Slogan &amp; Driver Community</title>

  <!-- FIREBASE -->
  <script src='https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js'></script>
  <script src='https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js'></script>
  <script src='https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js'></script>
  <script src='https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js'></script>

  <style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#111;
}

button,
input,
textarea,
select{
  font-family:Arial,Helvetica,sans-serif;
}

button{
  cursor:pointer;
}

#app{
  position:relative;
  width:100%;
  height:100vh;
  min-height:560px;
  overflow:hidden;
  background:#65b9d1;
  transition:background 1.5s ease;
}

/* SKY */

#sky{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:60%;
  z-index:1;
  background:linear-gradient(#1289bd 0%,#62cbe3 60%,#d9eee5 100%);
  transition:background 2s ease;
}

.cloud{
  position:absolute;
  width:140px;
  height:32px;
  border-radius:50px;
  background:rgba(255,255,255,.84);
  animation:cloudMove 35s linear infinite;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:inherit;
  border-radius:50%;
}

.cloud:before{
  width:55px;
  height:55px;
  left:18px;
  top:-28px;
}

.cloud:after{
  width:65px;
  height:65px;
  right:12px;
  top:-32px;
}

.cloud1{
  left:-180px;
  top:60px;
}

.cloud2{
  left:-450px;
  top:140px;
  transform:scale(.7);
  animation-duration:50s;
}

@keyframes cloudMove{
  from{margin-left:0;}
  to{margin-left:150vw;}
}

/* MOUNTAINS */

#mountains{
  position:absolute;
  left:0;
  right:0;
  bottom:40%;
  height:160px;
  z-index:5;
  overflow:hidden;
  transition:opacity 1s;
}

.mountain{
  position:absolute;
  bottom:0;
  width:0;
  height:0;
  border-left:150px solid transparent;
  border-right:150px solid transparent;
  border-bottom:150px solid #50775b;
  transition:border-bottom-color 1.5s;
}

.m1{left:-80px;}
.m2{left:210px;transform:scale(1.15);}
.m3{left:540px;transform:scale(.8);}
.m4{right:-100px;transform:scale(1.2);}

/* CITY */

#city{
  position:absolute;
  left:0;
  right:0;
  bottom:40%;
  height:110px;
  z-index:7;
  display:none;
  align-items:flex-end;
  justify-content:center;
  gap:6px;
}

.building{
  width:38px;
  border:1px solid #17242a;
  background:linear-gradient(90deg,#263238,#607d8b,#263238);
}

.b1{height:60px;}
.b2{height:95px;}
.b3{height:75px;}
.b4{height:110px;}
.b5{height:85px;}
.b6{height:120px;}
.b7{height:70px;}
.b8{height:90px;}

/* DESERT */

#desert{
  position:absolute;
  left:0;
  right:0;
  bottom:40%;
  height:90px;
  z-index:6;
  display:none;
  background:repeating-linear-gradient(
    0deg,
    #c89558 0 15px,
    #dda96a 15px 30px
  );
}

/* RIVER */

#river{
  position:absolute;
  left:0;
  right:0;
  bottom:40%;
  height:90px;
  z-index:8;
  display:none;
  background:repeating-linear-gradient(
    0deg,
    #087db7 0 7px,
    #58c9e8 7px 14px
  );
  animation:waterMove .6s linear infinite;
}

@keyframes waterMove{
  from{background-position:0 0;}
  to{background-position:0 70px;}
}

/* TREES */

.tree{
  position:absolute;
  bottom:40%;
  width:18px;
  height:60px;
  z-index:20;
  background:#60442d;
  transition:opacity 1s;
}

.tree:before{
  content:"";
  position:absolute;
  left:-25px;
  top:-45px;
  width:65px;
  height:65px;
  border-radius:50%;
  background:#237a3a;
  box-shadow:
    22px 12px 0 #318943,
    -14px 16px 0 #1e6933;
}

.t1{left:4%;}
.t2{left:18%;transform:scale(.75);}
.t3{left:34%;transform:scale(1.1);}
.t4{right:19%;transform:scale(.8);}
.t5{right:6%;transform:scale(1.15);}

/* TOP */

#location{
  position:absolute;
  top:15px;
  left:15px;
  z-index:500;
  padding:6px 12px;
  border-radius:10px;
  background:rgba(0,0,0,.72);
  color:#fff;
  backdrop-filter:blur(6px);
}

#location small{
  display:block;
  color:#ccc;
  font-size:8px;
  letter-spacing:2px;
}

#location b{
  color:#ffd43b;
  font-size:16px;
}

#topNavControls{
  position:absolute;
  top:15px;
  right:15px;
  z-index:900;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.actionBtn{
  padding:7px 14px;
  border-radius:20px;
  background:rgba(0,0,0,.82);
  color:#fff;
  border:2px solid #ffd43b;
  font-weight:bold;
  font-size:12px;
  backdrop-filter:blur(6px);
  box-shadow:0 4px 10px rgba(0,0,0,.4);
  transition:all .2s;
}

.actionBtn:hover{
  background:#ffd43b;
  color:#111;
  transform:translateY(-2px);
}

/* CITY BOARD */

#board{
  position:absolute;
  left:4%;
  bottom:43%;
  z-index:130;
  width:190px;
  padding:8px 10px;
  text-align:center;
  color:#fff;
  background:#087638;
  border:3px solid #fff;
  border-radius:3px;
  box-shadow:0 6px 15px rgba(0,0,0,.35);
  transition:opacity .6s,transform .6s;
}

#board.hide{
  opacity:0;
  transform:translateY(-25px);
}

#board strong{
  display:block;
  font-size:16px;
}

#board small{
  font-size:8px;
}

/* HIGHWAY */

#highway{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:40%;
  z-index:50;
  background:
    linear-gradient(
      #505050 0%,
      #303030 32%,
      #1a1a1a 100%
    );
  border-top:6px solid #eee;
  transition:background 1.5s;
}

#lane{
  position:absolute;
  left:0;
  right:0;
  top:45%;
  height:6px;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 70px,
      #fff 70px 150px
    );
  animation:laneMove .18s linear infinite;
}

.lanePaused{
  animation-play-state:paused !important;
}

@keyframes laneMove{
  from{background-position:0 0;}
  to{background-position:-150px 0;}
}

/* TRUCK */

#truckStage{
  position:absolute;
  left:0;
  right:0;
  bottom:14%;
  height:200px;
  z-index:200;
  overflow:visible;
  pointer-events:none;
}

#truck{
  position:absolute;
  left:-440px;
  bottom:0;
  width:400px;
  height:150px;
  filter:drop-shadow(0 8px 6px rgba(0,0,0,.5));
}

/* TRAILER */

.trailer{
  position:absolute;
  left:0;
  bottom:20px;
  width:260px;
  height:110px;
  border:3px solid #111;
  border-radius:6px 3px 3px 6px;
  overflow:visible;
}

/* SAFETY BOARD */

.copContainer{
  position:absolute;
  top:-65px;
  left:0;
  right:0;
  z-index:300;
  display:flex;
  align-items:center;
  justify-content:center;
}

.policeOfficer{
  font-size:36px;
  line-height:1;
  filter:drop-shadow(2px 2px 2px rgba(0,0,0,.5));
  margin-right:4px;
}

.safetyBoard{
  background:#fff;
  border:3px solid #d97706;
  border-radius:8px;
  padding:4px 8px;
  width:210px;
  box-shadow:0 4px 15px rgba(0,0,0,.4);
}

.safetyBoard header{
  background:#dc2626;
  color:#fff;
  font-size:9px;
  font-weight:900;
  text-align:center;
  padding:2px;
  border-radius:4px;
}

.safetyBoard p{
  margin:3px 0 0 0;
  color:#000;
  font-size:11px;
  font-weight:900;
  text-align:center;
  line-height:1.2;
}

/* SLOGAN */

.slogan{
  position:absolute;
  left:8px;
  bottom:12px;
  width:244px;
  padding:5px;
  text-align:center;
  color:#fff;
  font-weight:900;
  font-size:13px;
  background:rgba(0,0,0,.88);
  border:1px solid rgba(255,255,255,.4);
  border-radius:5px;
  text-shadow:1px 1px 2px #000;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* CABIN */

.cabin{
  position:absolute;
  right:0;
  bottom:20px;
  width:125px;
  height:110px;
  border:3px solid #111;
  border-radius:6px 22px 3px 3px;
}

.window{
  position:absolute;
  right:8px;
  top:10px;
  width:75px;
  height:42px;
  border:2px solid #111;
  border-radius:3px;
  background:linear-gradient(135deg,#d8f8ff,#267e9e);
}

.headlight{
  position:absolute;
  right:-6px;
  top:65px;
  width:11px;
  height:11px;
  border-radius:50%;
  background:#fff5a4;
  box-shadow:0 0 15px #fff5a4;
}

/* WHEELS */

.wheel{
  position:absolute;
  bottom:0;
  width:46px;
  height:46px;
  border:6px solid #555;
  border-radius:50%;
  background:#111;
  animation:wheelSpin .14s linear infinite;
  z-index:210;
}

.wheelPaused{
  animation-play-state:paused !important;
}

.wheel:after{
  content:"";
  position:absolute;
  left:9px;
  top:9px;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#aaa;
}

.w1{left:30px;}
.w2{left:190px;}
.w3{right:12px;}

@keyframes wheelSpin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

/* SOCIAL CARD */

#socialOverlay{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:92%;
  max-width:450px;
  background:rgba(15,23,42,.96);
  backdrop-filter:blur(10px);
  border:2px solid #ffd43b;
  border-radius:14px;
  padding:10px;
  z-index:700;
  color:#fff;
  display:none;
  pointer-events:auto;
  box-shadow:0 8px 25px rgba(0,0,0,.8);
}

.userSocialHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.12);
  padding-bottom:6px;
  margin-bottom:6px;
}

.userInfo{
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
}

.userAvatar{
  width:34px;
  height:34px;
  border-radius:50%;
  border:2px solid #ffd43b;
  object-fit:cover;
}

.userName{
  font-weight:bold;
  font-size:12px;
  color:#fff;
}

.userTag{
  font-size:9px;
  color:#93c5fd;
}

.userSloganQuote{
  font-size:12px;
  font-weight:bold;
  color:#fde047;
  text-align:center;
  margin:6px 0;
  background:rgba(255,255,255,.05);
  padding:6px;
  border-radius:6px;
  border-left:3px solid #fde047;
}

.socialBarButtons{
  display:flex;
  justify-content:space-around;
  border-top:1px solid rgba(255,255,255,.12);
  border-bottom:1px solid rgba(255,255,255,.12);
  padding:5px 0;
  margin-bottom:6px;
}

.sBtn{
  background:none;
  border:0;
  color:#cbd5e1;
  font-weight:bold;
  font-size:11px;
}

.sBtn:hover{
  color:#ffd43b;
}

#commentList{
  max-height:70px;
  overflow-y:auto;
  font-size:10px;
  margin-bottom:6px;
}

.commentItem{
  background:rgba(255,255,255,.08);
  padding:5px 7px;
  border-radius:5px;
  margin-bottom:3px;
  line-height:1.2;
}

.commentInputGroup{
  display:flex;
  gap:5px;
}

.commentInputGroup input{
  flex:1;
  padding:6px 9px;
  border-radius:15px;
  border:1px solid #475569;
  background:#1e293b;
  color:#fff;
  outline:none;
  font-size:11px;
}

/* MODALS */

.modalOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.86);
  z-index:2000;
  display:none;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.modalContent{
  background:
    linear-gradient(
      145deg,
      #1e293b,
      #0f172a
    );
  border:2px solid #ffd43b;
  color:#fff;
  padding:18px;
  border-radius:14px;
  width:92%;
  max-width:390px;
  box-shadow:0 10px 35px rgba(0,0,0,.7);
  position:relative;
  max-height:90vh;
  overflow-y:auto;
}

.modalContent h3{
  margin-top:0;
  color:#ffd43b;
  text-align:center;
  font-size:17px;
}

.modalContent input,
.modalContent textarea,
.modalContent select{
  width:100%;
  padding:9px;
  margin-bottom:10px;
  border:1px solid #475569;
  background:#0f172a;
  color:#fff;
  border-radius:7px;
  font-family:inherit;
  outline:none;
  font-size:12px;
}

.modalContent input:focus,
.modalContent textarea:focus,
.modalContent select:focus{
  border-color:#ffd43b;
}

/* IMAGE UPLOAD */

.imageUploadBox{
  width:100%;
  border:2px dashed #475569;
  border-radius:12px;
  padding:12px;
  text-align:center;
  margin-bottom:10px;
  background:rgba(255,255,255,.03);
}

.imageUploadBox:hover{
  border-color:#ffd43b;
}

.uploadPreview{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #ffd43b;
  display:block;
  margin:0 auto 8px;
  background:#111827;
}

.uploadLabel{
  display:inline-block;
  padding:8px 13px;
  border-radius:20px;
  background:#ffd43b;
  color:#111;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
}

.uploadLabel:hover{
  transform:scale(1.03);
}

.uploadHint{
  display:block;
  margin-top:6px;
  color:#94a3b8;
  font-size:9px;
}

#profileUploadInput,
#registerPhotoInput{
  display:none;
}

.uploadProgress{
  display:none;
  margin-top:7px;
}

.uploadProgressBar{
  height:7px;
  width:0%;
  border-radius:10px;
  background:#ffd43b;
  transition:width .2s;
}

.uploadProgressTrack{
  width:100%;
  height:7px;
  border-radius:10px;
  background:#334155;
  overflow:hidden;
}

/* LOGIN */

.loginLogo{
  width:70px;
  height:70px;
  border-radius:50%;
  margin:0 auto 8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  background:linear-gradient(145deg,#ffd43b,#e09b00);
  box-shadow:0 0 25px rgba(255,212,59,.35);
}

.loginSub{
  text-align:center;
  color:#94a3b8;
  font-size:11px;
  margin-top:-8px;
  margin-bottom:15px;
}

.loginMainBtn{
  width:100%;
  padding:11px;
  margin-bottom:8px;
  border:0;
  border-radius:8px;
  background:#ffd43b;
  color:#111;
  font-weight:900;
  cursor:pointer;
}

.loginMainBtn:hover{
  transform:translateY(-1px);
}

.loginMainBtn.blue{
  background:#2563eb;
  color:#fff;
}

#loginMessage{
  min-height:22px;
  margin-top:8px;
  text-align:center;
  font-size:11px;
  color:#ffd43b;
  font-weight:bold;
}

/* PROFILE */

.profileHeader{
  text-align:center;
  margin-bottom:12px;
}

.profileAvatarBig{
  width:95px;
  height:95px;
  border-radius:50%;
  border:3px solid #ffd43b;
  margin:0 auto 7px;
  display:block;
  object-fit:cover;
  background:#111827;
}

.profileTruckBadge{
  background:#0284c7;
  color:#fff;
  padding:3px 10px;
  border-radius:12px;
  font-size:10px;
  font-weight:bold;
  display:inline-block;
}

.profileStats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin:10px 0;
}

.profileStat{
  background:#111827;
  border:1px solid #334155;
  padding:8px 3px;
  border-radius:8px;
  text-align:center;
}

.profileStat b{
  display:block;
  color:#ffd43b;
  font-size:14px;
}

.profileStat span{
  font-size:8px;
  color:#94a3b8;
}

.profileSloganBox{
  max-height:170px;
  overflow-y:auto;
  background:#0f172a;
  padding:8px;
  border-radius:8px;
  margin-bottom:12px;
  border:1px solid #334155;
}

.profileSloganItem{
  background:#1e293b;
  border-left:3px solid #ffd43b;
  padding:7px 8px;
  border-radius:4px;
  font-size:11px;
  margin-bottom:6px;
}

/* HORNS */

#horns{
  position:absolute;
  left:12px;
  bottom:10px;
  z-index:800;
  display:flex;
  gap:6px;
}

.horn{
  width:42px;
  height:42px;
  border:2px solid #666;
  border-radius:50%;
  background:#171717;
  color:#fff;
  font-size:16px;
  transition:all .2s ease;
  box-shadow:0 3px 8px rgba(0,0,0,.5);
}

.horn:hover{
  background:#e9af2e;
  color:#111;
  transform:scale(1.08);
}

/* LOGIN USER */

#loggedUser{
  display:none;
  position:absolute;
  top:70px;
  right:15px;
  z-index:950;
  background:rgba(0,0,0,.85);
  color:#fff;
  border:1px solid #ffd43b;
  border-radius:10px;
  padding:6px 9px;
  font-size:10px;
}

.firebaseLoggedIn #loggedUser{
  display:block;
}

/* NOTIFICATION */

#notification{
  position:absolute;
  top:72px;
  left:50%;
  transform:translateX(-50%) translateY(-20px);
  z-index:2500;
  background:#111827;
  color:#fff;
  border:2px solid #ffd43b;
  padding:8px 14px;
  border-radius:20px;
  font-size:11px;
  opacity:0;
  pointer-events:none;
  transition:all .4s;
}

#notification.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* FOOTER */

.footer{
  position:absolute;
  left:0;
  right:0;
  bottom:2px;
  z-index:900;
  text-align:center;
  color:#aaa;
  font-size:8px;
  pointer-events:none;
}

.main{
  display:none !important;
}


/* =========================================================
   VEHICLE STICKER LIBRARY
========================================================= */

#stickerPage{
  position:fixed;
  inset:0;
  z-index:3000;
  display:none;
  background:rgba(2,6,12,.94);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  padding:14px;
}

#stickerPage.open{
  display:flex;
  align-items:center;
  justify-content:center;
}

.stickerPageBox{
  width:min(980px,100%);
  max-height:94vh;
  overflow:auto;
  background:#0f1720;
  border:2px solid #ffd43b;
  border-radius:18px;
  box-shadow:0 20px 80px rgba(0,0,0,.75);
}

.stickerPageTop{
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 14px;
  background:#121a24;
  border-bottom:1px solid #2c3644;
}

.stickerPageTop h3{
  margin:0;
  color:#ffd43b;
  font-size:16px;
}

.stickerPageTop small{
  display:block;
  color:#8492a5;
  font-size:8px;
  margin-top:3px;
}

.stickerClose{
  width:34px;
  height:34px;
  border:1px solid #3a4656;
  border-radius:9px;
  background:#1b2430;
  color:#fff;
  font-size:18px;
}

.stickerTabs{
  display:flex;
  gap:6px;
  overflow:auto;
  padding:10px 12px 5px;
}

.stickerTab{
  flex:0 0 auto;
  border:1px solid #344052;
  background:#17202b;
  color:#cbd5e1;
  border-radius:20px;

   COMPACT HIGHWAY PLAYER (90s MP3 STYLE)
========================================================= */

#shPlayerDock{
  position:fixed;
  right:12px;
  bottom:12px;
  z-index:999999;
  display:flex;
  align-items:center;
  gap:5px;
  pointer-events:auto;
}

#shPlayerButton,
#shPlayerMusic{
  height:36px;
  border:1px solid rgba(255,255,255,.24);
  background:rgba(10,14,20,.94);
  color:#fff;
  border-radius:20px;
  box-shadow:0 5px 22px rgba(0,0,0,.55);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  transition:.2s ease;
}

#shPlayerButton{
  padding:0 11px;
  display:flex;
  align-items:center;
  gap:6px;
  font-size:9px;
  font-weight:900;
  letter-spacing:.7px;
}

#shPlayerMusic{
  width:36px;
  padding:0;
  font-size:13px;
}

#shPlayerButton:hover,
#shPlayerMusic:hover{
  border-color:#ffd43b;
  transform:translateY(-2px);
}

.shPlayerPlayIcon{
  width:20px;
  height:20px;
  border-radius:50%;
  background:#ffd43b;
  color:#111;
  display:grid;
  place-items:center;
  font-size:9px;
}

#shPlayerPanel{
  position:fixed;
  right:12px;
  bottom:56px;
  width:min(350px,calc(100vw - 24px));
  max-height:78vh;
  overflow-y:auto;
  z-index:999998;
  background:#0d1118;
  border:1px solid #303846;
  border-radius:15px;
  box-shadow:0 25px 80px rgba(0,0,0,.72);
  opacity:0;
  visibility:hidden;
  transform:translateY(14px) scale(.97);
  transition:.22s ease;
}

#shPlayerPanel.open{
  opacity:1;
  visibility:visible;
  transform:translateY(0) scale(1);
}

.shPlayerTop{
  height:44px;
  padding:0 9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#151a22;
  border-bottom:1px solid #282f3b;
  position:sticky;
  top:0;
  z-index:10;
}

.shPlayerBrand{
  display:flex;
  align-items:center;
  gap:7px;
}

.shPlayerLogo{
  width:26px;
  height:26px;
  display:grid;
  place-items:center;
  border-radius:7px;
  background:rgba(255,212,59,.12);
  font-size:13px;
}

.shPlayerBrand b{
  display:block;
  color:#ffd43b;
  font-size:9px;
  letter-spacing:.6px;
}

.shPlayerBrand span{
  display:block;
  color:#687586;
  font-size:7px;
  margin-top:2px;
}

.shPlayerTopButtons{
  display:flex;
  gap:4px;
}

.shPlayerTopButtons button{
  width:28px;
  height:28px;
  border:1px solid #303746;
  background:#1b202a;
  color:#aaa;
  border-radius:7px;
  cursor:pointer;
}

.shPlayerTopButtons button:hover{
  color:#fff;
  border-color:#00d2ff;
}

/* MP3 Player Style Body */
.mp3PlayerBody{
  padding:20px 15px;
  text-align:center;
}

.mp3Disc{
  width:65px;
  height:65px;
  margin:0 auto 12px;
  border-radius:50%;
  background:linear-gradient(135deg, #ffd43b, #f59e0b);
  display:grid;
  place-items:center;
  font-size:28px;
  box-shadow:0 0 20px rgba(255,212,59,.3);
  animation:spinDisc 4s linear infinite;
}

@keyframes spinDisc {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.mp3Controls{
  display:flex;
  gap:8px;
  justify-content:center;
  margin-top:15px;
}

.mp3Btn{
  flex:1;
  padding:8px;
  border:none;
  border-radius:20px;
  background:#222d3d;
  color:#fff;
  font-weight:bold;
  font-size:10px;
  cursor:pointer;
  transition:.2s;
}

.mp3Btn:hover{
  background:#ffd43b;
  color:#111;
}

.mp3Btn.mainPlay{
  background:#ffd43b;
  color:#111;
}

.hiddenAudioFrame{
  display:none;
}

@media(max-width:600px){

  #shPlayerDock{
    right:7px;
    bottom:7px;
  }

  #shPlayerButton{
    width:36px;
    padding:0;
    justify-content:center;
  }

  #shPlayerButton .shPlayerText{
    display:none;
  }

  #shPlayerPanel{
    right:7px;
    bottom:49px;
    width:calc(100vw - 14px);
    max-height:76vh;
    border-radius:12px;
  }

}

<div id='app'>

  <!-- AUDIO -->

  </audio>

  <audio id='hornAudio1' preload='auto'>
    <source src='https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a81691.mp3' type='audio/mpeg'/>
  </audio>

  <!-- SKY -->

  <div id='sky'>
    <div class='cloud cloud1'></div>
    <div class='cloud cloud2'></div>
  </div>

  <!-- LOCATION -->

  <div id='location'>
    <small>NOW DRIVING</small>
    <b id='cityName'>JAIPUR</b>
  </div>

  <!-- TOP -->

  <div id='topNavControls'>

    <button class='actionBtn' onclick='openLoginModal()'>
      👤 LOGIN
    </button>

    <button class='actionBtn' id='garageBtn' onclick='openMyGarage()' style='display:none;'>
      🚛 MY GARAGE
    </button>

    <button class='actionBtn' onclick='openModal()'>
      &#9997;&#65039; POST
    </button>

    <button class='actionBtn' id='audioBtn' onclick='toggleAudio()'>

    </button>

  </div>

  <div id='loggedUser'></div>

  <div id='notification'></div>

  <!-- MOUNTAINS -->

  <div id='mountains'>

    <div class='mountain m1'></div>
    <div class='mountain m2'></div>
    <div class='mountain m3'></div>
    <div class='mountain m4'></div>

  </div>

  <!-- CITY -->

  <div id='city'>

    <div class='building b1'></div>
    <div class='building b2'></div>
    <div class='building b3'></div>
    <div class='building b4'></div>
    <div class='building b5'></div>
    <div class='building b6'></div>
    <div class='building b7'></div>
    <div class='building b8'></div>

  </div>

  <div id='desert'></div>

  <div id='river'></div>

  <!-- TREES -->

  <div class='tree t1'></div>
  <div class='tree t2'></div>
  <div class='tree t3'></div>
  <div class='tree t4'></div>
  <div class='tree t5'></div>

  <!-- CITY BOARD -->

  <div id='board'>

    <strong id='boardCity'>JAIPUR</strong>

    <small id='boardInfo'>
      PINK CITY &#8226; RAJASTHAN
    </small>

  </div>

  <!-- HIGHWAY -->

  <div id='highway'>

    <div id='lane'></div>

  </div>

  <!-- TRUCK -->

  <div id='truckStage'>

    <div id='truck'></div>

  </div>

  <!-- =========================================================
     90s MP3 PLAYER WIDGET (ADDED)
========================================================= -->
  <div id='shPlayerDock'>
    <button id='shPlayerButton' onclick='toggleMp3Player()'>
      <span class='shPlayerPlayIcon'>🎵</span>
      <span class='shPlayerText'>90s MP3</span>
    </button>
  </div>

  <div id='shPlayerPanel'>
    <div class='shPlayerTop'>
      <div class='shPlayerBrand'>
        <div class='shPlayerLogo'>🎧</div>
        <div>
          <b>90s ROMANTIC HITS</b>
          <span>Audio Playlist Player</span>
        </div>
      </div>
      <div class='shPlayerTopButtons'>
        <button onclick='toggleMp3Player()'>&times;</button>
      </div>
    </div>

    <!-- Hidden Audio Stream Provider -->
    <iframe id='hiddenAudioFrame' class='hiddenAudioFrame' src="" allow="autoplay"></iframe>

    <div class='mp3PlayerBody'>
      <div class='mp3Disc'>💿</div>
      <div style='color:#fff; font-size:11px; font-weight:bold; margin-bottom:4px;' id='currentSongText'>Non-Stop 90s Playlist</div>
      <div style='color:#8492a5; font-size:8px;'>Enjoy music while driving on highway</div>

      <div class='mp3Controls'>
        <button class='mp3Btn' onclick='playPrevSong()'>⏮ Prev</button>
        <button class='mp3Btn mainPlay' onclick='togglePlayPause()' id='playPauseBtn'>⏸ Pause</button>
        <button class='mp3Btn' onclick='playNextSong()'>Next ⏭</button>
      </div>
    </div>
  </div>

  <!-- SOCIAL OVERLAY -->

  <div id='socialOverlay'>

    <div class='userSocialHeader'>

      <div class='userInfo' onclick='openCurrentDriverProfile()'>

        <img alt='Driver' class='userAvatar' id='sAvatar' src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'/>

        <div>

          <div class='userName' id='sAuthor'>
            Highway Driver
          </div>

          <div class='userTag'>
            🚛 Driver Profile
          </div>

        </div>

      </div>

      <span style='font-size:9px;color:#ffd43b;background:rgba(255,212,59,.15);padding:3px 6px;border-radius:8px;'>
        🚛 LIVE
      </span>

    </div>

    <div class='userSloganQuote' id='sQuote'>
      &quot;Highway Slogan&quot;
    </div>

    <div class='socialBarButtons'>

      <button class='sBtn' onclick='likePost()'>
        &#10084;&#65039; Like <span id='likeCount'>0</span>
      </button>

      <button class='sBtn' onclick='focusComment()'>
        💬 Comment <span id='commentCount'>0</span>
      </button>

      <button class='sBtn' onclick='sharePost()'>
        🔗 Share
      </button>

    </div>

    <div id='commentList'></div>

    <div class='commentInputGroup'>

      <input id='cInput' placeholder='Comment लिखें...' type='text'/>

      <button class='actionBtn' onclick='addComment()' style='padding:4px 10px;font-size:10px;'>
        SEND
      </button>

    </div>

  </div>

  <!-- LOGIN / REGISTER MODAL -->

  <div class='modalOverlay' id='loginModal'>

    <div class='modalContent'>

      <div class='loginLogo'>
        🚛
      </div>

      <h3>
        SOCIAL HIGHWAY
      </h3>

      <div class='loginSub'>
        India Truck Driver Community
      </div>

      <!-- PROFILE IMAGE -->

      <div class='imageUploadBox'>

        <img alt='Profile Preview' class='uploadPreview' id='registerPhotoPreview' src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'/>

        <label class='uploadLabel' for='registerPhotoInput'>
          📷 SELECT PROFILE PHOTO
        </label>

        <input accept='image/jpeg,image/png,image/webp' id='registerPhotoInput' type='file'/>

        <span class='uploadHint'>
          JPG / PNG / WebP &#8226; Max 5MB
        </span>

        <div class='uploadProgress' id='registerProgress'>

          <div class='uploadProgressTrack'>
            <div class='uploadProgressBar' id='registerProgressBar'></div>
          </div>

        </div>

      </div>

      <input id='loginName' placeholder='Driver Name' type='text'/>

      <input id='loginEmail' placeholder='Email Address' type='email'/>

      <input id='loginPassword' placeholder='Password - minimum 6 characters' type='password'/>

      <input id='loginTruck' placeholder='Truck Name' type='text'/>

      <select id='loginTruckColor'>

        <option value='#d62828'>
          🔴 Red Truck
        </option>

        <option value='#1769aa'>
          🔵 Blue Truck
        </option>

        <option value='#198754'>
          🟢 Green Truck
        </option>

        <option value='#ef9d16'>
          🟠 Orange Truck
        </option>

        <option value='#8e44ad'>
          🟣 Purple Truck
        </option>

        <option value='#111111'>
          &#9899; Black Truck
        </option>

      </select>

      <button class='loginMainBtn' id='registerButton' onclick='firebaseRegister()'>
        🚛 CREATE ACCOUNT
      </button>

      <button class='loginMainBtn blue' onclick='firebaseLogin()'>
        🔑 LOGIN
      </button>

      <button class='actionBtn' onclick='closeLoginModal()' style='width:100%;'>
        CLOSE
      </button>

      <div id='loginMessage'></div>

    </div>

  </div>

</div>

<script>
  let isPlaying = false;
  const mp3PlaylistId = "PL6VikFWYkZnvc00H1-sjzFd104TF1J0fA";

  function toggleMp3Player() {
    const panel = document.getElementById('shPlayerPanel');
    const iframe = document.getElementById('hiddenAudioFrame');
    
    if(!panel.classList.contains('open') && !iframe.src) {
      iframe.src = `https://www.youtube.com/embed/videoseries?list=${mp3PlaylistId}&autoplay=1`;
      isPlaying = true;
    }
    
    panel.classList.toggle('open');
  }

  function playNextSong() {
    const iframe = document.getElementById('hiddenAudioFrame');
    iframe.src = iframe.src;
  }

  function playPrevSong() {
    const iframe = document.getElementById('hiddenAudioFrame');
    iframe.src = iframe.src;
  }

  function togglePlayPause() {
    const btn = document.getElementById('playPauseBtn');
    const iframe = document.getElementById('hiddenAudioFrame');
    if(isPlaying) {
      iframe.src = "";
      btn.innerHTML = "▶ Play";
      isPlaying = false;
    } else {
      iframe.src = `https://www.youtube.com/embed/videoseries?list=${mp3PlaylistId}&autoplay=1`;
      btn.innerHTML = "⏸ Pause";
      isPlaying = true;
    }
  }
</script>
