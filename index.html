<!doctype html>
<html lang="en">

<head>
  <meta name="theme-color" content="#111827"/>
  <meta charset='UTF-8'/>
  <meta content='width=device-width, initial-scale=1.0' name='viewport'/>

  <title>Social Highway India - Truck Slogan &amp; Driver Community</title>

  <!-- FIREBASE -->
  <script src='https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js'></script>
  <script src='https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js'></script>
  <script src='https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js'></script>
  <script src='https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js'></script>

  <style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#111;
}

button,
input,
textarea,
select{
  font-family:Arial,Helvetica,sans-serif;
}

button{
  cursor:pointer;
}

#app{
  position:relative;
  width:100%;
  height:100vh;
  min-height:560px;
  overflow:hidden;
  background:#65b9d1;
  transition:background 1.5s ease;
}

/* SKY */
#sky{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:60%;
  z-index:1;
  background:linear-gradient(#1289bd 0%,#62cbe3 60%,#d9eee5 100%);
  transition:background 2s ease;
}

.cloud{
  position:absolute;
  width:140px;
  height:32px;
  border-radius:50px;
  background:rgba(255,255,255,.84);
  animation:cloudMove 35s linear infinite;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:inherit;
  border-radius:50%;
}

.cloud:before{
  width:55px;
  height:55px;
  left:18px;
  top:-28px;
}

.cloud:after{
  width:65px;
  height:65px;
  right:12px;
  top:-32px;
}

.cloud1{left:-180px;top:60px;}
.cloud2{left:-450px;top:140px;transform:scale(.7);animation-duration:50s;}

@keyframes cloudMove{
  from{margin-left:0;}
  to{margin-left:150vw;}
}

/* MOUNTAINS */
#mountains{
  position:absolute;
  left:0;
  right:0;
  bottom:40%;
  height:160px;
  z-index:5;
  overflow:hidden;
}

.mountain{
  position:absolute;
  bottom:0;
  width:0;
  height:0;
  border-left:150px solid transparent;
  border-right:150px solid transparent;
  border-bottom:150px solid #50775b;
}

.m1{left:-80px;}
.m2{left:210px;transform:scale(1.15);}
.m3{left:540px;transform:scale(.8);}
.m4{right:-100px;transform:scale(1.2);}

/* LOCATION */
#location{
  position:absolute;
  top:15px;
  left:15px;
  z-index:500;
  padding:6px 12px;
  border-radius:10px;
  background:rgba(0,0,0,.72);
  color:#fff;
  backdrop-filter:blur(6px);
}

#location small{
  display:block;
  color:#ccc;
  font-size:8px;
  letter-spacing:2px;
}

#location b{
  color:#ffd43b;
  font-size:16px;
}

/* HIGHWAY */
#highway{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:40%;
  z-index:50;
  background:linear-gradient(#505050 0%,#303030 32%,#1a1a1a 100%);
  border-top:6px solid #eee;
}

#lane{
  position:absolute;
  left:0;
  right:0;
  top:45%;
  height:6px;
  background:repeating-linear-gradient(90deg,transparent 0 70px,#fff 70px 150px);
  animation:laneMove .18s linear infinite;
}

@keyframes laneMove{
  from{background-position:0 0;}
  to{background-position:-150px 0;}
}

/* =========================================================
   MP3 STYLE AUDIO PLAYER WIDGET (NO VIDEO SCREEN)
========================================================= */
#shPlayerDock{
  position:fixed;
  right:15px;
  bottom:15px;
  z-index:999999;
  display:flex;
  align-items:center;
  gap:8px;
  pointer-events:auto;
}

#shPlayerButton{
  height:45px;
  padding:0 18px;
  border:2px solid #ffd43b;
  background:linear-gradient(135deg, #111827, #1f2937);
  color:#ffd43b;
  border-radius:30px;
  box-shadow:0 6px 25px rgba(0,0,0,.6);
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  transition:all .3s ease;
}

#shPlayerButton:hover{
  transform:translateY(-3px) scale(1.03);
  background:#ffd43b;
  color:#111;
}

.shPlayerPlayIcon{
  width:28px;
  height:28px;
  border-radius:50%;
  background:#ffd43b;
  color:#111;
  display:grid;
  place-items:center;
  font-size:12px;
}

#shPlayerButton:hover .shPlayerPlayIcon{
  background:#111;
  color:#ffd43b;
}

/* MP3 Player Panel */
#shPlayerPanel{
  position:fixed;
  right:15px;
  bottom:75px;
  width:min(350px,calc(100vw - 30px));
  z-index:999998;
  background:linear-gradient(145deg, #0f172a, #1e293b);
  border:2px solid #ffd43b;
  border-radius:20px;
  box-shadow:0 20px 50px rgba(0,0,0,.85);
  opacity:0;
  visibility:hidden;
  transform:translateY(20px) scale(.95);
  transition:all .3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  overflow:hidden;
}

#shPlayerPanel.open{
  opacity:1;
  visibility:visible;
  transform:translateY(0) scale(1);
}

.mp3Header{
  padding:12px 15px;
  background:rgba(0,0,0,.4);
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.1);
}

.mp3TitleInfo b{
  display:block;
  color:#ffd43b;
  font-size:12px;
}

.mp3TitleInfo span{
  display:block;
  color:#94a3b8;
  font-size:9px;
  margin-top:2px;
}

.mp3CloseBtn{
  background:none;
  border:none;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

/* Hidden YouTube iframe to stream clean audio */
.hiddenAudioFrame{
  display:none;
}

/* MP3 Visualizer Box / Disk Animation */
.mp3Body{
  padding:20px 15px;
  text-align:center;
}

.mp3Disc{
  width:70px;
  height:70px;
  margin:0 auto 15px;
  border-radius:50%;
  background:linear-gradient(135deg, #ffd43b, #f59e0b);
  display:grid;
  place-items:center;
  font-size:30px;
  box-shadow:0 0 20px rgba(255,212,59,.4);
  animation: spinDisc 4s linear infinite;
}

@keyframes spinDisc {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.mp3Controls{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:15px;
}

.mp3Btn{
  flex:1;
  padding:10px;
  border:none;
  border-radius:25px;
  background:#334155;
  color:#fff;
  font-weight:bold;
  font-size:11px;
  cursor:pointer;
  transition:.2s;
}

.mp3Btn:hover{
  background:#ffd43b;
  color:#111;
}

.mp3Btn.mainPlay{
  background:#ffd43b;
  color:#111;
}
  </style>
</head>

<body>

<div id='app'>

  <!-- SKY -->
  <div id='sky'>
    <div class='cloud cloud1'></div>
    <div class='cloud cloud2'></div>
  </div>

  <!-- LOCATION -->
  <div id='location'>
    <small>NOW DRIVING</small>
    <b id='cityName'>JAIPUR</b>
  </div>

  <!-- HIGHWAY -->
  <div id='highway'>
    <div id='lane'></div>
  </div>

  <!-- =========================================================
     MP3 AUDIO PLAYER WIDGET (NO VIDEO / NO SCREEN)
  ========================================================= -->
  <div id='shPlayerDock'>
    <button id='shPlayerButton' onclick='toggleMp3Player()'>
      <span class='shPlayerPlayIcon'>🎵</span>
      <span>90s AUDIO PLAYER</span>
    </button>
  </div>

  <div id='shPlayerPanel'>
    <div class='mp3Header'>
      <div class='mp3TitleInfo'>
        <b>90s Classic Hits</b>
        <span>Non-Stop Audio Stream</span>
      </div>
      <button class='mp3CloseBtn' onclick='toggleMp3Player()'>&times;</button>
    </div>

    <!-- Hidden audio provider iframe (0 size to prevent video display) -->
    <iframe id='hiddenAudioFrame' class='hiddenAudioFrame' src="" allow="autoplay"></iframe>

    <div class='mp3Body'>
      <div class='mp3Disc'>💿</div>
      <div style='color:#fff; font-size:12px; font-weight:bold; margin-bottom:5px;' id='currentSongText'>Playing 90s Non-Stop Playlist</div>
      <div style='color:#64748b; font-size:9px;'>Enjoy old is gold melodies while driving</div>

      <div class='mp3Controls'>
        <button class='mp3Btn' onclick='playPrevSong()'>⏮ Prev</button>
        <button class='mp3Btn mainPlay' onclick='togglePlayPause()' id='playPauseBtn'>⏸ Pause</button>
        <button class='mp3Btn' onclick='playNextSong()'>Next ⏭</button>
      </div>
    </div>
  </div>

</div>

<script>
  let isPlaying = false;
  const playlistId = "PL6VikFWYkZnvc00H1-sjzFd104TF1J0fA";

  function toggleMp3Player() {
    const panel = document.getElementById('shPlayerPanel');
    const iframe = document.getElementById('hiddenAudioFrame');
    
    // First time open load source
    if(!panel.classList.contains('open') && !iframe.src) {
      iframe.src = `https://www.youtube.com/embed/videoseries?list=${playlistId}&autoplay=1`;
      isPlaying = true;
    }
    
    panel.classList.toggle('open');
  }

  function playNextSong() {
    const iframe = document.getElementById('hiddenAudioFrame');
    // Refreshing source triggers next item in playlist stream
    iframe.src = iframe.src;
  }

  function playPrevSong() {
    const iframe = document.getElementById('hiddenAudioFrame');
    iframe.src = iframe.src;
  }

  function togglePlayPause() {
    const btn = document.getElementById('playPauseBtn');
    const iframe = document.getElementById('hiddenAudioFrame');
    if(isPlaying) {
      iframe.src = ""; // stops audio
      btn.innerHTML = "▶ Play";
      isPlaying = false;
    } else {
      iframe.src = `https://www.youtube.com/embed/videoseries?list=${playlistId}&autoplay=1`;
      btn.innerHTML = "⏸ Pause";
      isPlaying = true;
    }
  }
</script>

</body>
</html>
