<!doctype html>
<html lang="en">

<head>
  <meta name="theme-color" content="#111827"/>
  <meta charset='UTF-8'/>
  <meta content='width=device-width, initial-scale=1.0' name='viewport'/>

  <title>Social Highway India - Truck Slogan &amp; Driver Community</title>

  <!-- FIREBASE -->
  <script src='https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js'></script>
  <script src='https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js'></script>
  <script src='https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js'></script>
  <script src='https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js'></script>

  <style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#111;
}

button,
input,
textarea,
select{
  font-family:Arial,Helvetica,sans-serif;
}

button{
  cursor:pointer;
}

#app{
  position:relative;
  width:100%;
  height:100vh;
  min-height:560px;
  overflow:hidden;
  background:#65b9d1;
  transition:background 1.5s ease;
}

/* SKY */
#sky{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:60%;
  z-index:1;
  background:linear-gradient(#1289bd 0%,#62cbe3 60%,#d9eee5 100%);
  transition:background 2s ease;
}

.cloud{
  position:absolute;
  width:140px;
  height:32px;
  border-radius:50px;
  background:rgba(255,255,255,.84);
  animation:cloudMove 35s linear infinite;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:inherit;
  border-radius:50%;
}

.cloud:before{
  width:55px;
  height:55px;
  left:18px;
  top:-28px;
}

.cloud:after{
  width:65px;
  height:65px;
  right:12px;
  top:-32px;
}

.cloud1{
  left:-180px;
  top:60px;
}

.cloud2{
  left:-450px;
  top:140px;
  transform:scale(.7);
  animation-duration:50s;
}

@keyframes cloudMove{
  from{margin-left:0;}
  to{margin-left:150vw;}
}

/* MOUNTAINS */
#mountains{
  position:absolute;
  left:0;
  right:0;
  bottom:40%;
  height:160px;
  z-index:5;
  overflow:hidden;
  transition:opacity 1s;
}

.mountain{
  position:absolute;
  bottom:0;
  width:0;
  height:0;
  border-left:150px solid transparent;
  border-right:150px solid transparent;
  border-bottom:150px solid #50775b;
  transition:border-bottom-color 1.5s;
}

.m1{left:-80px;}
.m2{left:210px;transform:scale(1.15);}
.m3{left:540px;transform:scale(.8);}
.m4{right:-100px;transform:scale(1.2);}

/* CITY */
#city{
  position:absolute;
  left:0;
  right:0;
  bottom:40%;
  height:110px;
  z-index:7;
  display:none;
  align-items:flex-end;
  justify-content:center;
  gap:6px;
}

.building{
  width:38px;
  border:1px solid #17242a;
  background:linear-gradient(90deg,#263238,#607d8b,#263238);
}

.b1{height:60px;}
.b2{height:95px;}
.b3{height:75px;}
.b4{height:110px;}
.b5{height:85px;}
.b6{height:120px;}
.b7{height:70px;}
.b8{height:90px;}

/* DESERT */
#desert{
  position:absolute;
  left:0;
  right:0;
  bottom:40%;
  height:90px;
  z-index:6;
  display:none;
  background:repeating-linear-gradient(
    0deg,
    #c89558 0 15px,
    #dda96a 15px 30px
  );
}

/* RIVER */
#river{
  position:absolute;
  left:0;
  right:0;
  bottom:40%;
  height:90px;
  z-index:8;
  display:none;
  background:repeating-linear-gradient(
    0deg,
    #087db7 0 7px,
    #58c9e8 7px 14px
  );
  animation:waterMove .6s linear infinite;
}

@keyframes waterMove{
  from{background-position:0 0;}
  to{background-position:0 70px;}
}

/* TREES */
.tree{
  position:absolute;
  bottom:40%;
  width:18px;
  height:60px;
  z-index:20;
  background:#60442d;
  transition:opacity 1s;
}

.tree:before{
  content:"";
  position:absolute;
  left:-25px;
  top:-45px;
  width:65px;
  height:65px;
  border-radius:50%;
  background:#237a3a;
  box-shadow:
    22px 12px 0 #318943,
    -14px 16px 0 #1e6933;
}

.t1{left:4%;}
.t2{left:18%;transform:scale(.75);}
.t3{left:34%;transform:scale(1.1);}
.t4{right:19%;transform:scale(.8);}
.t5{right:6%;transform:scale(1.15);}

/* TOP */
#location{
  position:absolute;
  top:15px;
  left:15px;
  z-index:500;
  padding:6px 12px;
  border-radius:10px;
  background:rgba(0,0,0,.72);
  color:#fff;
  backdrop-filter:blur(6px);
}

#location small{
  display:block;
  color:#ccc;
  font-size:8px;
  letter-spacing:2px;
}

#location b{
  color:#ffd43b;
  font-size:16px;
}

#topNavControls{
  position:absolute;
  top:15px;
  right:15px;
  z-index:900;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.actionBtn{
  padding:7px 14px;
  border-radius:20px;
  background:rgba(0,0,0,.82);
  color:#fff;
  border:2px solid #ffd43b;
  font-weight:bold;
  font-size:12px;
  backdrop-filter:blur(6px);
  box-shadow:0 4px 10px rgba(0,0,0,.4);
  transition:all .2s;
}

.actionBtn:hover{
  background:#ffd43b;
  color:#111;
  transform:translateY(-2px);
}

/* HIGHWAY */
#highway{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:40%;
  z-index:50;
  background:
    linear-gradient(
      #505050 0%,
      #303030 32%,
      #1a1a1a 100%
    );
  border-top:6px solid #eee;
  transition:background 1.5s;
}

#lane{
  position:absolute;
  left:0;
  right:0;
  top:45%;
  height:6px;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 70px,
      #fff 70px 150px
    );
  animation:laneMove .18s linear infinite;
}

@keyframes laneMove{
  from{background-position:0 0;}
  to{background-position:-150px 0;}
}

/* TRUCK */
#truckStage{
  position:absolute;
  left:0;
  right:0;
  bottom:14%;
  height:200px;
  z-index:200;
  overflow:visible;
  pointer-events:none;
}

#truck{
  position:absolute;
  left:-440px;
  bottom:0;
  width:400px;
  height:150px;
  filter:drop-shadow(0 8px 6px rgba(0,0,0,.5));
}

/* =========================================================
   COLORFUL & ATTRACTIVE 90s BOLLYWOOD PLAYER
========================================================= */
#shPlayerDock{
  position:fixed;
  right:15px;
  bottom:15px;
  z-index:999999;
  display:flex;
  align-items:center;
  gap:8px;
  pointer-events:auto;
}

#shPlayerButton{
  height:44px;
  padding:0 16px;
  border:2px solid #ff416c;
  background:linear-gradient(135deg, #ff416c, #ff4b2b);
  color:#fff;
  border-radius:30px;
  box-shadow:0 6px 25px rgba(255,65,108,.5);
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
  transition:all .3s ease;
}

#shPlayerButton:hover{
  transform:translateY(-3px) scale(1.03);
  box-shadow:0 8px 30px rgba(255,65,108,.7);
}

.shPlayerPlayIcon{
  width:26px;
  height:26px;
  border-radius:50%;
  background:#fff;
  color:#ff416c;
  display:grid;
  place-items:center;
  font-size:11px;
}

#shPlayerPanel{
  position:fixed;
  right:15px;
  bottom:70px;
  width:min(420px,calc(100vw - 30px));
  z-index:999998;
  background:linear-gradient(160deg, #1f1c2c, #928dab);
  border:3px solid #ff416c;
  border-radius:20px;
  box-shadow:0 20px 50px rgba(0,0,0,.8);
  opacity:0;
  visibility:hidden;
  transform:translateY(20px) scale(.95);
  transition:all .3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  overflow:hidden;
}

#shPlayerPanel.open{
  opacity:1;
  visibility:visible;
  transform:translateY(0) scale(1);
}

.shPlayerTop{
  height:50px;
  padding:0 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(0,0,0,.4);
  border-bottom:2px solid rgba(255,255,255,.1);
}

.shPlayerBrand{
  display:flex;
  align-items:center;
  gap:10px;
}

.shPlayerLogo{
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:#ff416c;
  font-size:16px;
}

.shPlayerBrand b{
  display:block;
  color:#fff;
  font-size:12px;
  letter-spacing:1px;
}

.shPlayerBrand span{
  display:block;
  color:#ffdf00;
  font-size:9px;
  margin-top:2px;
}

.shPlayerCloseBtn{
  width:32px;
  height:32px;
  border:none;
  background:rgba(255,255,255,.2);
  color:#fff;
  border-radius:50%;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.shPlayerCloseBtn:hover{
  background:#ff416c;
}

.shPlayerVideo{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}

.shPlayerVideo iframe{
  width:100%;
  height:100%;
  display:block;
  border:0;
}

.shPlayerControls{
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(0,0,0,.3);
  gap:10px;
}

.shControlBtn{
  flex:1;
  padding:10px;
  border:none;
  border-radius:30px;
  background:linear-gradient(135deg, #00c6ff, #0072ff);
  color:#fff;
  font-weight:bold;
  font-size:11px;
  cursor:pointer;
  box-shadow:0 4px 15px rgba(0,114,255,.4);
  transition:.2s;
}

.shControlBtn:hover{
  transform:translateY(-2px);
  filter:brightness(1.1);
}

.shControlBtn.prev{
  background:linear-gradient(135deg, #f7b733, #fc4a1a);
  box-shadow:0 4px 15px rgba(252,74,26,.4);
}
  </style>
</head>

<body>

<div id='app'>

  <!-- SKY -->
  <div id='sky'>
    <div class='cloud cloud1'></div>
    <div class='cloud cloud2'></div>
  </div>

  <!-- LOCATION -->
  <div id='location'>
    <small>NOW DRIVING</small>
    <b id='cityName'>JAIPUR</b>
  </div>

  <!-- HIGHWAY -->
  <div id='highway'>
    <div id='lane'></div>
  </div>

  <!-- TRUCK -->
  <div id='truckStage'>
    <div id='truck'></div>
  </div>

  <!-- =========================================================
     90s BOLLYWOOD SONG PLAYER WIDGET (WITH PREV/NEXT & ATTRACTIVE UI)
  ========================================================= -->
  <div id='shPlayerDock'>
    <button id='shPlayerButton' onclick='toggleShPlayer()'>
      <span class='shPlayerPlayIcon'>🎵</span>
      <span>90s HITS PLAYER</span>
    </button>
  </div>

  <div id='shPlayerPanel'>
    <div class='shPlayerTop'>
      <div class='shPlayerBrand'>
        <div class='shPlayerLogo'>🎧</div>
        <div>
          <b>90s BOLLYWOOD ROMANTIC</b>
          <span>Non-Stop Classic Playlist</span>
        </div>
      </div>
      <button class='shPlayerCloseBtn' onclick='toggleShPlayer()'>&times;</button>
    </div>

    <!-- YouTube Playlist Player Embed -->
    <div class='shPlayerVideo'>
      <iframe id='shYoutubeFrame' src="https://www.youtube.com/embed/videoseries?list=PL6VikFWYkZnvc00H1-sjzFd104TF1J0fA&autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <!-- Player Action Buttons -->
    <div class='shPlayerControls'>
      <button class='shControlBtn prev' onclick='playPrevSong()'>⏮ PREV SONG</button>
      <button class='shControlBtn' onclick='playNextSong()'>NEXT SONG ⏭</button>
    </div>
  </div>

</div>

<script>
  // Player Toggle Logic
  function toggleShPlayer() {
    const panel = document.getElementById('shPlayerPanel');
    panel.classList.toggle('open');
  }

  // Playlist Navigation Simulated/Controlled via iframe reload or parameters
  const playlistId = "PL6VikFWYkZnvc00H1-sjzFd104TF1J0fA";
  
  function playNextSong() {
    const iframe = document.getElementById('shYoutubeFrame');
    // Reloading or cycling iframe to trigger next item simulation in embed playlist
    iframe.src = iframe.src;
    showNotification("playing next 90s track! 🎶");
  }

  function playPrevSong() {
    const iframe = document.getElementById('shYoutubeFrame');
    iframe.src = iframe.src;
    showNotification("playing previous track! 🎵");
  }

  function showNotification(msg) {
    // Optional helper feedback
    console.log(msg);
  }
</script>

</body>
</html>
