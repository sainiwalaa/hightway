<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>90s Retro Bollywood Music Player</title>
    <!-- Google Fonts & FontAwesome for icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            width: 900px;
            max-width: 100%;
            background: rgba(25, 25, 35, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Player Section */
        .player-section {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-title {
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #ffcc00;
            margin-bottom: 20px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .album-art {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            margin-bottom: 25px;
            border: 4px solid #ffcc00;
            animation: rotateArt 20s linear infinite;
            animation-play-state: paused;
        }

        .album-art.playing {
            animation-play-state: running;
        }

        @keyframes rotateArt {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .song-info {
            margin-bottom: 20px;
            width: 100%;
        }

        .song-title {
            font-size: 1.3rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
        }

        .song-artist {
            font-size: 0.9rem;
            color: #aaa;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress {
            height: 100%;
            background: #ffcc00;
            border-radius: 3px;
            width: 0%;
            position: relative;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #aaa;
            margin-top: 5px;
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .controls button {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .controls button:hover {
            color: #ffcc00;
            transform: scale(1.1);
        }

        .controls .play-btn {
            background: #ffcc00;
            color: #1f1c2c;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            box-shadow: 0 5px 15px rgba(255, 204, 0, 0.4);
        }

        .controls .play-btn:hover {
            background: #ffd633;
            color: #1f1c2c;
        }

        /* Playlist Section */
        .playlist-section {
            width: 350px;
            display: flex;
            flex-direction: column;
            background: rgba(15, 15, 20, 0.5);
        }

        .playlist-header {
            padding: 20px;
            font-size: 1rem;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
        }

        .playlist {
            flex: 1;
            overflow-y: auto;
            max-height: 480px;
            padding: 10px;
        }

        .playlist::-webkit-scrollbar {
            width: 6px;
        }

        .playlist::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 5px;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .playlist-item.active {
            background: rgba(255, 204, 0, 0.2);
            border-left: 4px solid #ffcc00;
        }

        .playlist-item img {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            object-fit: cover;
        }

        .playlist-item-info {
            flex: 1;
            overflow: hidden;
        }

        .playlist-item-title {
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item-artist {
            font-size: 0.7rem;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Hidden YouTube Iframe Container */
        #youtube-player {
            display: none;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                width: 100%;
            }
            .playlist-section {
                width: 100%;
            }
            .playlist {
                max-height: 250px;
            }
        }
    </style>
</head>

    <div class="container">
        <!-- Player Controls & Display -->
        <div class="player-section">
            <div class="header-title"><i class="fa-solid fa-compact-disc"></i> 90s Retro Beats</div>
            
            <div class="album-art" id="albumArtContainer">
                <img id="currentCover" src="" alt="Album Art">
            </div>

            <div class="song-info">
                <div class="song-title" id="currentTitle">Select a Song</div>
                <div class="song-artist" id="currentArtist">Artist Name</div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="time-info">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button id="prevBtn" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
                <button class="play-btn" id="playBtn" title="Play/Pause"><i class="fa-solid fa-play" id="playIcon"></i></button>
                <button id="nextBtn" title="Next"><i class="fa-solid fa-forward-step"></i></button>
            </div>
        </div>

        <!-- Playlist Drawer -->
        <div class="playlist-section">
            <div class="playlist-header">Queue (<span id="songCount">0</span> Songs)</div>
            <div class="playlist" id="playlistContainer">
                <!-- Dynamically populated via JS -->
            </div>
        </div>
    </div>

    <!-- Hidden YouTube Player Container -->
    <div id="youtube-player"></div>

            { id: "jEL02Nz7Dds", title: "Dono Hi Mohabbat Ke", artist: "Altaf Raja", cover: "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/87/5f/ca/875fcaaa-d6e0-932f-a9da-4a492a8f893e/cover.jpg/400x400bb.jpg", duration: 535 },
            { id: "mocKoIhNJxk", title: "Ding Dong Dole", artist: "KuTuB", cover: "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/4a/9b/ff/4a9bff84-9b05-d481-b278-5ef5de6e322c/195375079420.png/400x400bb.jpg", duration: 403 },
            { id: "Tx7YCSTJC6I", title: "Dheere Dheere Tere Bina", artist: "T-Series", cover: "https://i.ytimg.com/vi/Tx7YCSTJC6I/hqdefault.jpg", duration: 272 },
            { id: "jD3SGW0NHY0", title: "Kumar Sanu 90's Hits", artist: "Shemaroo Filmi Gaane", cover: "https://i.ytimg.com/vi/jD3SGW0NHY0/hqdefault.jpg", duration: 373 },
            { id: "0A2ue4lNMzo", title: "Wafa Na Raas Aayee", artist: "Nitin Mukesh", cover: "https://is1-ssl.mzstatic.com/image/thumb/Music123/v4/49/24/0a/49240a1f-219a-82d3-fa93-3cd6d36eb08d/8903431717023_cover.jpg/400x400bb.jpg", duration: 366 },
            { id: "s4slgbuwOfw", title: "O Dil Tod Ke Hansti Ho Mera", artist: "Pop Chartbusters", cover: "https://i.ytimg.com/vi/s4slgbuwOfw/hqdefault.jpg", duration: 280 }
        ];

        let player;
        let currentIndex = 0;
        let isPlaying = false;
        let updateTimer;

        // DOM Elements
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const currentTitle = document.getElementById('currentTitle');
        const currentArtist = document.getElementById('currentArtist');
        const currentCover = document.getElementById('currentCover');
        const albumArtContainer = document.getElementById('albumArtContainer');
        const progressBar = document.getElementById('progressBar');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const playlistContainer = document.getElementById('playlistContainer');
        const songCount = document.getElementById('songCount');

        // Initialize YouTube Iframe API
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            buildPlaylist();
            loadSong(currentIndex);
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                isPlaying = true;
                playIcon.className = "fa-solid fa-pause";
                albumArtContainer.classList.add('playing');
                startProgressInterval();
            } else if (event.data == YT.PlayerState.PAUSED) {
                isPlaying = false;
                playIcon.className = "fa-solid fa-play";
                albumArtContainer.classList.remove('playing');
                clearInterval(updateTimer);
            } else if (event.data == YT.PlayerState.ENDED) {
                nextSong();
            }
        }

        // Build Playlist DOM
        function buildPlaylist() {
            playlistContainer.innerHTML = '';
            songCount.innerText = songs.length;
            songs.forEach((song, index) => {
                const item = document.createElement('div');
                item.classList.add('playlist-item');
                if (index === currentIndex) item.classList.add('active');
                item.innerHTML = `
                    <img src="${song.cover || 'https://via.placeholder.com/45'}" alt="Thumb">
                    <div class="playlist-item-info">
                        <div class="playlist-item-title">${song.title}</div>
                        <div class="playlist-item-artist">${song.artist}</div>
                    </div>
                `;
                item.addEventListener('click', () => {
                    currentIndex = index;
                    loadSong(currentIndex);
                    playSong();
                });
                playlistContainer.appendChild(item);
            });
        }

        function updateActivePlaylistUI() {
            const items = playlistContainer.querySelectorAll('.playlist-item');
            items.forEach((item, index) => {
                if (index === currentIndex) {
                    item.classList.add('active');
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    item.classList.remove('active');
                }
            });
        }

        function loadSong(index) {
            const song = songs[index];
            currentTitle.innerText = song.title;
            currentArtist.innerText = song.artist;
            currentCover.src = song.cover || 'https://via.placeholder.com/220';
            durationEl.innerText = formatTime(song.duration);
            if (player && player.loadVideoById) {
                player.cueVideoById(song.id);
            }
            updateActivePlaylistUI();
        }

        function playSong() {
            if (player && player.playVideo) {
                player.loadVideoById(songs[currentIndex].id);
            }
        }

        function togglePlay() {
            if (!player) return;
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        function nextSong() {
            currentIndex = (currentIndex + 1) % songs.length;
            loadSong(currentIndex);
            playSong();
        }

        function prevSong() {
            currentIndex = (currentIndex - 1 + songs.length) % songs.length;
            loadSong(currentIndex);
            playSong();
        }

        // Progress Bar handling
        function startProgressInterval() {
            clearInterval(updateTimer);
            updateTimer = setInterval(() => {
                if (player && player.getCurrentTime && player.getDuration) {
                    const current = player.getCurrentTime();
                    const duration = player.getDuration() || songs[currentIndex].duration;
                    const percent = (current / duration) * 100;
                    progress.style.width = `${percent}%`;
                    currentTimeEl.innerText = formatTime(current);
                }
            }, 1000);
        }

        progressBar.addEventListener('click', (e) => {
            const width = progressBar.clientWidth;
            const clickX = e.offsetX;
            const duration = player.getDuration() || songs[currentIndex].duration;
            player.seekTo((clickX / width) * duration, true);
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Event Listeners
        playBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', nextSong);
        prevBtn.addEventListener('click', prevSong);
    </script>
</body>
</html>
